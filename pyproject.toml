[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "proxy-traffic-lab"
version = "0.1.0"
description = "Controlled encrypted proxy traffic collection laboratory"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary research tooling" }
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
lab = "proxy_traffic_lab.controller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proxy_traffic_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

