schema_version: 1

cases:
  - id: class-01-shadowsocks-2022-tcp
    dataset_class: 1
    enabled: false
    protocol: shadowsocks
    client: sing-box
    server: shadowsocks-rust
    outer_transport: tcp
    wrapper: raw
    security: shadowsocks-2022
    cipher: 2022-blake3-aes-128-gcm
    inner_networks: [tcp]

  - id: class-02-shadowsocks-2022-udp
    dataset_class: 2
    enabled: false
    protocol: shadowsocks
    client: sing-box
    server: shadowsocks-rust
    outer_transport: udp
    wrapper: raw
    security: shadowsocks-2022
    cipher: 2022-blake3-aes-128-gcm
    inner_networks: [udp]

  - id: class-03-ssr-auth-aes128-md5
    dataset_class: 3
    enabled: false
    protocol: shadowsocksr
    client: shadowsocksr-libev
    server: shadowsocksr-libev
    outer_transport: tcp
    wrapper: raw
    security: none
    cipher: aes-256-cfb
    protocol_plugin: auth_aes128_md5
    obfs: tls1.2_ticket_auth
    inner_networks: [tcp]

  - id: class-04-ssr-auth-aes128-sha1
    dataset_class: 4
    enabled: false
    protocol: shadowsocksr
    client: shadowsocksr-libev
    server: shadowsocksr-libev
    outer_transport: tcp
    wrapper: raw
    security: none
    cipher: aes-256-cfb
    protocol_plugin: auth_aes128_sha1
    obfs: tls1.2_ticket_auth
    inner_networks: [tcp]

  - id: class-05-vmess-websocket-tls
    dataset_class: 5
    enabled: true
    protocol: vmess
    client: xray
    server: xray
    outer_transport: tcp
    wrapper: websocket
    security: tls
    flow: null
    inner_networks: [tcp]

  - id: class-06-vmess-xhttp-h2-tls
    dataset_class: 6
    enabled: true
    protocol: vmess
    client: xray
    server: xray
    outer_transport: tcp
    wrapper: xhttp
    security: tls
    obfs_mode: h2
    inner_networks: [tcp]

  - id: class-07-vless-raw-reality-vision
    dataset_class: 7
    enabled: true
    protocol: vless
    client: xray
    server: xray
    outer_transport: tcp
    wrapper: raw
    security: reality
    flow: xtls-rprx-vision
    inner_networks: [tcp]

  - id: class-08-vless-grpc-tls
    dataset_class: 8
    enabled: true
    protocol: vless
    client: xray
    server: xray
    outer_transport: tcp
    wrapper: grpc
    security: tls
    inner_networks: [tcp]

  - id: class-09-trojan-raw-tls
    dataset_class: 9
    enabled: false
    protocol: trojan
    client: xray
    server: xray
    outer_transport: tcp
    wrapper: raw
    security: tls
    inner_networks: [tcp]

  - id: class-10-trojan-websocket-tls
    dataset_class: 10
    enabled: false
    protocol: trojan
    client: xray
    server: xray
    outer_transport: tcp
    wrapper: websocket
    security: tls
    inner_networks: [tcp]

  - id: class-11-hysteria2-quic-tls
    dataset_class: 11
    enabled: false
    protocol: hysteria2
    client: sing-box
    server: hysteria2
    outer_transport: udp
    wrapper: quic
    security: tls
    inner_networks: [tcp, udp]

  - id: class-12-hysteria2-quic-salamander-tls
    dataset_class: 12
    enabled: false
    protocol: hysteria2
    client: sing-box
    server: hysteria2
    outer_transport: udp
    wrapper: quic
    security: tls
    obfs: salamander
    inner_networks: [tcp, udp]
