schema_version: 1
role: server
data_root: /var/lib/proxy-traffic-lab
log_level: INFO

runtime:
  # Used by lifecycle commands when --case/--core is omitted.
  # Protocol cases still select their declared client/server implementation.
  default_core: xray-core

limits:
  max_experiment_seconds: 300
  max_capture_bytes: 536870912
  max_connections: 32
  max_bandwidth_mbps: 10
  min_free_disk_gib: 10

vps:
  host: null
  ssh_user: root
  ssh_port: 22
  identity_file: null

